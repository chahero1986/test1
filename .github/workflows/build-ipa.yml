name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned, no developer account needed)
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSpaceMaster.xcodeproj \
            -scheme PhotoSpaceMaster \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -type d -name "*.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PhotoSpaceMaster-unsigned.ipa Payload
          ls -lh PhotoSpaceMaster-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSpaceMaster-unsigned-ipa
          path: PhotoSpaceMaster-unsigned.ipa
          if-no-files-found: error
